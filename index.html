<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Movie Night Poster Generator</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #1a0f0f;
            color: #f4e8c1;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 15px;
        }

        .poster-container {
            max-width: 550px;
            margin: 10px auto;
            background: #4a1515;
            border: 6px solid #2e0d0d;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .marquee {
            background: #ffdb58;
            color: #1a0f0f;
            padding: 12px;
            font-weight: bold;
            font-size: 1.3rem;
            border: 3px dashed #8b0000;
            border-radius: 8px;
            margin-bottom: 20px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .movies-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .movie-card {
            background: #112233;
            border: 3px solid #ffdb58;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .movie-title {
            margin: 0 0 12px 0;
            color: #ffdb58;
            font-size: 1.1rem;
            line-height: 1.3;
            width: 100%;
        }

        .poster-frame {
            margin-bottom: 12px;
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .movie-poster {
            width: 100%;
            max-width: 180px;
            height: auto;
            border: 2px solid #ffdb58;
            border-radius: 6px;
            background: #2e1a1a;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }

        .meta-tags {
            font-size: 0.8rem;
            color: #e0ac69;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .synopsis-box {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 6px;
            padding: 10px;
            border-left: 3px solid #ffdb58;
            width: 100%;
            text-align: left;
        }

        .synopsis-box p {
            font-size: 0.82rem;
            line-height: 1.4;
            margin: 0;
            color: #e6dfc5;
        }

        button, input {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            padding: 10px 14px;
            border-radius: 6px;
            border: none;
            margin: 6px 0;
        }

        button {
            background-color: #ffdb58;
            color: #1a0f0f;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            width: 100%;
            transition: background 0.2s;
        }

        button:hover { 
            background-color: #ffe885; 
        }

        input { 
            width: 100%; 
            background: #2e1a1a; 
            color: #f4e8c1; 
            border: 1px solid #ffdb58; 
        }

        .settings { 
            background: #261212; 
            padding: 15px; 
            border-radius: 8px; 
            margin-bottom: 15px; 
            border: 1px solid #5a2222;
        }
    </style>
</head>
<body>

    <div class="poster-container">
        <div class="marquee">HOME CINEMA<br>NOW SHOWING</div>

        <div class="settings" id="settings-box">
            <p style="margin: 0 0 8px 0; font-size: 0.85rem;">Enter your MDBlist API Key:</p>
            <input type="password" id="apiKeyInput" placeholder="MDBlist API Key">
            <br>
            <button onclick="saveApiKey()">Save & Load Watchlist</button>
        </div>
        
        <div id="movie-list">
            <p>Connecting to your live watchlist...</p>
        </div>

        <button onclick="pickRandomMovies()" id="pick-btn" style="display:none; margin-top: 20px;">🎲 Pick 3 New Feature Films</button>
    </div>

    <script>
        let cachedWatchlist = [];

        window.onload = function() {
            try {
                const savedKey = localStorage.getItem("mdblist_api_key");
                if (savedKey) {
                    document.getElementById("apiKeyInput").value = savedKey;
                    document.getElementById("settings-box").style.display = "none";
                    fetchWatchlist(savedKey);
                } else {
                    document.getElementById("movie-list").innerHTML = "<p>Please enter your API key to get started.</p>";
                }
            } catch (err) {
                console.error("Initialization error:", err);
            }
        };

        function saveApiKey() {
            const key = document.getElementById("apiKeyInput").value.trim();
            if (key) {
                localStorage.setItem("mdblist_api_key", key);
                document.getElementById("settings-box").style.display = "none";
                fetchWatchlist(key);
            }
        }

        async function fetchWatchlist(apiKey) {
            const container = document.getElementById("movie-list");
            container.innerHTML = "<p>Connecting to MDBlist API...</p>";

            try {
                // Fetch basic watchlist items
                const response = await fetch(`https://api.mdblist.com/watchlist/items?apikey=${apiKey}`);
                if (!response.ok) throw new Error("Failed to fetch watchlist. Check your API key.");
                
                const data = await response.json();
                let rawList = Array.isArray(data) ? data : (data.movies || data.results || data.items || Object.values(data).find(v => Array.isArray(v)) || []);

                // Filter for movies only
                cachedWatchlist = rawList.filter(item => item.mediatype === 'movie' || item.type === 'movie' || !item.mediatype);

                if (cachedWatchlist.length === 0) {
                    container.innerHTML = "<p>No movies found in your watchlist.</p>";
                    return;
                }

                document.getElementById("pick-btn").style.display = "inline-block";
                pickRandomMovies();

            } catch (error) {
                container.innerHTML = `<p style="color: #ff6b6b;">Error: ${error.message}</p>`;
                document.getElementById("settings-box").style.display = "block";
            }
        }

        function getPosterUrl(movie) {
            // Check direct poster fields
            if (movie.poster_url) return movie.poster_url;
            if (movie.poster && movie.poster.startsWith('http')) return movie.poster;

            // Check TMDB path
            if (movie.poster_path) {
                return `https://image.tmdb.org/t/p/w500${movie.poster_path}`;
            }
            if (movie.poster && movie.poster.startsWith('/')) {
                return `https://image.tmdb.org/t/p/w500${movie.poster}`;
            }

            // Fallback placeholder poster generator
            const title = encodeURIComponent(movie.title || 'Movie');
            return `https://placehold.co/300x450/112233/ffdb58?text=${title}`;
        }

        function pickRandomMovies() {
            if (cachedWatchlist.length === 0) return;

            let shuffled = [...cachedWatchlist].sort(() => 0.5 - Math.random());
            let selected = shuffled.slice(0, 3);

            let container = document.getElementById("movie-list");
            container.innerHTML = '<div class="movies-grid"></div>';
            let grid = container.querySelector('.movies-grid');

            selected.forEach((movie, index) => {
                let releaseYear = movie.release_year || (movie.release_date ? movie.release_date.split("-")[0] : movie.year || "N/A");
                let synopsis = movie.description || movie.overview || "A captivating feature film handpicked from your live watchlist.";
                let posterUrl = getPosterUrl(movie);
                let rating = movie.score ? `Score: ${movie.score}%` : (movie.imdb_rating ? `IMDb: ${movie.imdb_rating}` : "");

                grid.innerHTML += `
                    <div class="movie-card">
                        <h3 class="movie-title">${index + 1}. ${movie.title} (${releaseYear})</h3>
                        <div class="poster-frame">
                            <img src="${posterUrl}" alt="${movie.title} Poster" class="movie-poster" onerror="this.onerror=null; this.src='https://placehold.co/300x450/112233/ffdb58?text=Poster+Unavailable';">
                        </div>
                        ${rating ? `<div class="meta-tags">${rating}</div>` : ''}
                        <div class="synopsis-box">
                            <p>${synopsis}</p>
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>

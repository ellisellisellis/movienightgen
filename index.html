<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Movie Night Picker</title>
    <style>
        body {
            background-color: #1a0f0f;
            color: #f4e8c1;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 15px;
        }
        .poster {
            max-width: 500px;
            margin: 10px auto;
            background: #4a1515;
            border: 6px solid #2e0d0d;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .marquee {
            background: #ffdb58;
            color: #1a0f0f;
            padding: 10px;
            font-weight: bold;
            font-size: 1.3rem;
            border: 3px dashed #8b0000;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .panel {
            background: #112233;
            border: 3px solid #ffdb58;
            border-radius: 6px;
            padding: 12px;
            margin: 12px 0;
            text-align: left;
        }
        .panel h3 {
            margin-top: 0;
            color: #ffdb58;
            font-size: 1rem;
        }
        .panel p {
            font-size: 0.8rem;
            line-height: 1.3;
            margin-bottom: 0;
        }
        button, input {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            padding: 10px 14px;
            border-radius: 6px;
            border: none;
            margin: 6px 0;
        }
        button {
            background-color: #ffdb58;
            color: #1a0f0f;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            width: 100%;
        }
        button:hover { background-color: #ffe885; }
        input { width: 90%; background: #2e1a1a; color: #f4e8c1; border: 1px solid #ffdb58; box-sizing: border-box; }
        .settings { background: #261212; padding: 12px; border-radius: 8px; margin-bottom: 12px; }
    </style>
</head>
<body>

    <div class="poster">
        <div class="marquee">HOME CINEMA<br>NOW SHOWING</div>

        <div class="settings" id="settings-box">
            <p style="margin: 0 0 8px 0; font-size: 0.85rem;">Enter your MDBlist API Key:</p>
            <input type="password" id="apiKeyInput" placeholder="Enter MDBlist API Key">
            <br>
            <button onclick="saveApiKey()">Save & Load Watchlist</button>
        </div>
        
        <div id="movie-list">
            <p>Connecting to your live watchlist...</p>
        </div>

        <button onclick="pickRandomMovies()" id="pick-btn" style="display:none;">🎲 Pick 3 New Movies</button>
    </div>

    <script>
        let cachedWatchlist = [];

        window.onload = function() {
            const savedKey = localStorage.getItem("mdblist_api_key");
            if (savedKey) {
                document.getElementById("apiKeyInput").value = savedKey;
                document.getElementById("settings-box").style.display = "none";
                fetchWatchlist(savedKey);
            }
        };

        function saveApiKey() {
            const key = document.getElementById("apiKeyInput").value.trim();
            if (key) {
                localStorage.setItem("mdblist_api_key", key);
                document.getElementById("settings-box").style.display = "none";
                fetchWatchlist(key);
            }
        }

        async function fetchWatchlist(apiKey) {
            const container = document.getElementById("movie-list");
            container.innerHTML = "<p>Connecting to MDBlist API...</p>";

            try {
                const response = await fetch(`https://api.mdblist.com/watchlist/items?apikey=${apiKey}`);
                if (!response.ok) throw new Error("Failed to fetch watchlist. Check your API key.");
                
                const data = await response.json();
                
                // Strictly filter for movies only
                cachedWatchlist = data.filter(item => item.mediatype === 'movie');

                if (cachedWatchlist.length === 0) {
                    container.innerHTML = "<p>No movies found in your watchlist.</p>";
                    return;
                }

                document.getElementById("pick-btn").style.display = "inline-block";
                pickRandomMovies();

            } catch (error) {
                container.innerHTML = `<p style="color: #ff6b6b;">Error: ${error.message}</p>`;
                document.getElementById("settings-box").style.display = "block";
            }
        }

        function pickRandomMovies() {
            if (cachedWatchlist.length === 0) return;

            let shuffled = [...cachedWatchlist].sort(() => 0.5 - Math.random());
            let selected = shuffled.slice(0, 3);

            let container = document.getElementById("movie-list");
            container.innerHTML = "";

            selected.forEach((movie, index) => {
                let releaseYear = movie.release_year || (movie.release_date ? movie.release_date.split("-")[0] : "N/A");
                let synopsis = movie.description || "A captivating feature film handpicked from your live watchlist.";
                
                container.innerHTML += `
                    <div class="panel">
                        <h3>${index + 1}. ${movie.title} (${releaseYear})</h3>
                        <p>${synopsis}</p>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Movie Night Poster Generator</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #1a0f0f;
            color: #f4e8c1;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 15px;
        }

        .poster-container {
            max-width: 550px;
            margin: 10px auto;
            background: #4a1515;
            border: 6px solid #2e0d0d;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .marquee {
            background: #ffdb58;
            color: #1a0f0f;
            padding: 12px;
            font-weight: bold;
            font-size: 1.3rem;
            border: 3px dashed #8b0000;
            border-radius: 8px;
            margin-bottom: 20px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .movies-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .movie-card {
            background: #112233;
            border: 3px solid #ffdb58;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .movie-title {
            margin: 0 0 12px 0;
            color: #ffdb58;
            font-size: 1.1rem;
            line-height: 1.3;
            width: 100%;
        }

        .poster-frame {
            margin-bottom: 12px;
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .movie-poster {
            width: 100%;
            max-width: 200px;
            height: auto;
            border: 2px solid #ffdb58;
            border-radius: 6px;
            background: #2e1a1a;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }

        .meta-tags {
            font-size: 0.8rem;
            color: #e0ac69;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .synopsis-box {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 6px;
            padding: 10px;
            border-left: 3px solid #ffdb58;
            width: 100%;
            text-align: left;
        }

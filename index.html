<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Movie Night Poster Generator</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #1a0f0f;
            color: #f4e8c1;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 15px;
        }

        .poster-container {
            max-width: 550px;
            margin: 10px auto;
            background: #4a1515;
            border: 6px solid #2e0d0d;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .marquee {
            background: #ffdb58;
            color: #1a0f0f;
            padding: 12px;
            font-weight: bold;
            font-size: 1.3rem;
            border: 3px dashed #8b0000;
            border-radius: 8px;
            margin-bottom: 20px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .movies-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .movie-card {
            background: #112233;
            border: 3px solid #ffdb58;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .movie-title {
            margin: 0 0 12px 0;
            color: #ffdb58;
            font-size: 1.1rem;
            line-height: 1.3;
            width: 100%;
        }

        .poster-frame {
            margin-bottom: 12px;
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .movie-poster {
            width: 100%;
            max-width: 200px;
            height: auto;
            border: 2px solid #ffdb58;
            border-radius: 6px;
            background: #2e1a1a;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }

        .meta-tags {
            font-size: 0.8rem;
            color: #e0ac69;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .synopsis-box {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 6px;
            padding: 10px;
            border-left: 3px solid #ffdb58;
            width: 100%;
            text-align: left;
        }

        .synopsis-box p {
            font-size: 0.82rem;
            line-height: 1.4;
            margin: 0;
            color: #e6dfc5;
        }

        button, input {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            padding: 10px 14px;
            border-radius: 6px;
            border: none;
            margin: 6px 0;
        }

        button {
            background-color: #ffdb58;
            color: #1a0f0f;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            width: 100%;
            transition: background 0.2s;
        }

        button:hover { 
            background-color: #ffe885; 
        }

        .btn-secondary {
            background-color: #112233;
            color: #ffdb58;
            border: 2px solid #ffdb58;
        }

        .btn-secondary:hover {
            background-color: #1a334e;
        }

        input { 
            width: 100%; 
            background: #2e1a1a; 
            color: #f4e8c1; 
            border: 1px solid #ffdb58; 
        }

        .settings { 
            background: #261212; 
            padding: 15px; 
            border-radius: 8px; 
            margin-bottom: 15px; 
            border: 1px solid #5a2222;
        }

        .share-toast {
            display: none;
            background: #ffdb58;
            color: #1a0f0f;
            padding: 8px;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 10px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="poster-container">
        <div class="marquee" id="marquee-header">HOME CINEMA<br>NOW SHOWING</div>

        <div class="settings" id="settings-box">
            <p style="margin: 0 0 8px 0; font-size: 0.85rem;">Enter your MDBlist API Key:</p>
            <input type="password" id="apiKeyInput" placeholder="MDBlist API Key">
            <br>
            <button onclick="saveApiKey()">Save & Load Watchlist</button>
        </div>
        
        <div id="movie-list">
            <p>Connecting to your live watchlist...</p>
        </div>

        <div id="controls-area" style="margin-top: 20px;">
            <button onclick="pickRandomMovies()" id="pick-btn" style="display:none;">🎲 Pick 3 New Feature Films</button>
            <button onclick="shareCurrentList()" id="share-btn" class="btn-secondary" style="display:none; margin-top: 10px;">🔗 Share Static List</button>
        </div>

        <div id="share-toast" class="share-toast">Copied link to clipboard!</div>
    </div>

    <script>
        let cachedWatchlist = [];
        let currentSelection = [];

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const sharedData = urlParams.get('list');

            if (sharedData) {
                renderSharedList(sharedData);
            } else {
                const savedKey = localStorage.getItem("mdblist_api_key");
                if (savedKey) {
                    document.getElementById("apiKeyInput").value = savedKey;
                    document.getElementById("settings-box").style.display = "none";
                    fetchWatchlist(savedKey);
                } else {
                    document.getElementById("movie-list").innerHTML = "<p>Please enter your API key to get started.</p>";
                }
            }
        };

        function saveApiKey() {
            const key = document.getElementById("apiKeyInput").value.trim();
            if (key) {
                localStorage.setItem("mdblist_api_key", key);
                document.getElementById("settings-box").style.display = "none";
                fetchWatchlist(key);
            }
        }

        async function fetchWatchlist(apiKey) {
            const container = document.getElementById("movie-list");
            container.innerHTML = "<p>Connecting to MDBlist API...</p>";

            try {
                const response = await fetch(`https://api.mdblist.com/watchlist/items?apikey=${apiKey}&append_to_response=poster`);
                if (!response.ok) throw new Error("Failed to fetch watchlist. Check your API key.");
                
                const data = await response.json();
                let rawList = Array.isArray(data) ? data : (data.movies || data.results || data.items || Object.values(data).find(v => Array.isArray(v)) || []);

                cachedWatchlist = rawList.filter(item => item.mediatype === 'movie' || item.type === 'movie');

                if (cachedWatchlist.length === 0) {
                    container.innerHTML = "<p>No movies found in your watchlist.</p>";
                    return;
                }

                document.getElementById("pick-btn").style.display = "inline-block";
                pickRandomMovies();

            } catch (error) {
                container.innerHTML = `<p style="color: #ff6b6b;">Error: ${error.message}</p>`;
                document.getElementById("settings-box").style.display = "block";
            }
        }

        function pickRandomMovies() {
            if (cachedWatchlist.length === 0) return;

            let shuffled = [...cachedWatchlist].sort(() => 0.5 - Math.random());
            currentSelection = shuffled.slice(0, 3);

            renderMovies(currentSelection);
            document.getElementById("share-btn").style.display = "inline-block";
        }

        function renderMovies(moviesList) {
            let container = document.getElementById("movie-list");
            container.innerHTML = '<div class="movies-grid"></div>';
            let grid = container.querySelector('.movies-grid');

            moviesList.forEach((movie, index) => {
                let releaseYear = movie.year || movie.release_year || (movie.release_date ? movie.release_date.split("-")[0] : "N/A");
                let synopsis = movie.synopsis || movie.description || movie.overview || "A captivating feature film handpicked from your live watchlist.";
                
                let posterUrl = movie.poster || movie.poster_path || "";
                if (posterUrl && posterUrl.startsWith('/')) {
                    posterUrl = `https://image.tmdb.org/t/p/w500${posterUrl}`;
                }
                if (!posterUrl) {
                    posterUrl = "https://via.placeholder.com/200x300?text=No+Poster";
                }

                let rating = movie.rating || (movie.score ? `Score: ${movie.score}%` : (movie.imdb_rating ? `IMDb: ${movie.imdb_rating}` : ""));

                grid.innerHTML += `
                    <div class="movie-card">
                        <h3 class="movie-title">${index + 1}. ${movie.title} (${releaseYear})</h3>
                        <div class="poster-frame">
                            <img src="${posterUrl}" alt="${movie.title} Poster" class="movie-poster" onerror="this.src='https://via.placeholder.com/200x300?text=Poster+Error'">
                        </div>
                        ${rating ? `<div class="meta-tags">${rating}</div>` : ''}
                        <div class="synopsis-box">
                            <p>${synopsis}</p>
                        </div>
                    </div>
                `;
            });
        }

        function shareCurrentList() {
            if (currentSelection.length === 0) return;

            const compactList = currentSelection.map(m => {
                let pUrl = m.poster || m.poster_path || "";
                if (pUrl && pUrl.startsWith('/')) {
                    pUrl = `https://image.tmdb.org/t/p/w500${pUrl}`;
                }
                return {
                    title: m.title,
                    year: m.release_year || (m.release_date ? m.release_date.split("-")[0] : m.year || ""),
                    poster: pUrl,
                    rating: m.score ? `Score: ${m.score}%` : (m.imdb_rating ? `IMDb: ${m.imdb_rating}` : ""),
                    synopsis: m.description || m.overview || ""
                };
            });

            const encodedData = encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(compactList)))));
            const shareUrl = `${window.location.origin}${window.location.pathname}?list=${encodedData}`;

            navigator.clipboard.writeText(shareUrl).then(() => {
                const toast = document.getElementById("share-toast");
                toast.style.display = "block";
                setTimeout(() => { toast.style.display = "none"; }, 3000);
            }).catch(err => {
                prompt("Copy this URL to share your static movie list:", shareUrl);
            });
        }

        function renderSharedList(encodedData) {
            try {
                const jsonString = decodeURIComponent(escape(atob(decodeURIComponent(encodedData))));
                const sharedMovies = JSON.parse(jsonString);

                document.getElementById("settings-box").style.display = "none";
                document.getElementById("marquee-header").innerHTML = "MOVIE NIGHT<br>SPECIAL SELECTION";
                
                renderMovies(sharedMovies);

                // Clear controls area completely for the shared view
                document.getElementById("controls-area").innerHTML = "";
            } catch (e) {
                document.getElementById("movie-list").innerHTML = "<p style='color: #ff6b6b;'>Invalid or corrupted share link.</p>";
            }
        }
    </script>
</body>
</html>
